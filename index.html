<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Codle</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Clear, accurate programming lessons with an in-browser playground, quizzes, and challenges for Python, JavaScript, HTML & CSS, Lua, C#, C++, and Java.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="js/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#" aria-label="Codle home"><img src="assets/logo.webp" alt="Codle" width="106" height="30"></a>
        <nav class="langs" id="langs" role="tablist" aria-label="Language"></nav>
        <label class="locale" title="Interface language">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm-9-9h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <select id="ui-lang" aria-label="Interface language"></select>
        </label>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="sun" d="M12 4V2M12 22v-2M4.9 4.9 3.5 3.5M20.5 20.5l-1.4-1.4M4 12H2M22 12h-2M4.9 19.1l-1.4 1.4M20.5 3.5l-1.4 1.4M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <section class="langbar" id="langbar" aria-live="polite"></section>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footer">
      <p id="footer-text"></p>
    </footer>
  </div>

  <script src="js/vendor/codemirror/codemirror.js"></script>
  <script src="js/vendor/codemirror/mode/python.js"></script>
  <script src="js/vendor/codemirror/mode/javascript.js"></script>
  <script src="js/vendor/codemirror/mode/xml.js"></script>
  <script src="js/vendor/codemirror/mode/css.js"></script>
  <script src="js/vendor/codemirror/mode/htmlmixed.js"></script>
  <script src="js/vendor/codemirror/mode/lua.js"></script>
  <script src="js/vendor/codemirror/mode/clike.js"></script>
  <script src="js/vendor/codemirror/addon/runmode.js"></script>
  <script src="js/vendor/codemirror/addon/matchbrackets.js"></script>
  <script src="js/vendor/codemirror/addon/closebrackets.js"></script>
  <script src="js/vendor/codemirror/addon/comment.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/content.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/runners.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
